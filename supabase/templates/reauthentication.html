<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Código de confirmação</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
<span style="display:none!important;visibility:hidden;opacity:0;height:0;width:0;overflow:hidden;">Use este código para confirmar a alteração.</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#ffffff;border-radius:12px;border:1px solid #e3e5ea;">
        <tr>
          <td style="padding:28px 32px 8px 32px;">
            <img src="https://atratis-approval.vercel.app/logo-atratis.png" width="132" height="36" alt="Atratis Digital" style="display:block;border:0;width:132px;height:auto;">
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 8px 32px;font-family:Arial,Helvetica,sans-serif;color:#232427;">
            <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;font-weight:bold;color:#232427;">Código de confirmação</h1>
            <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#4a4c52;">Use o código abaixo para confirmar a alteração no seu acesso ao portal da Atratis.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 20px 32px;font-family:Arial,Helvetica,sans-serif;">
            <p style="margin:0 0 8px 0;font-size:14px;color:#4a4c52;">Seu código:</p>
            <p style="margin:0;font-size:28px;letter-spacing:6px;font-weight:bold;color:#232427;background:#f9fafb;border:1px solid #e3e5ea;border-radius:8px;padding:12px 16px;display:inline-block;">{{ .Token }}</p>
          </td>
        </tr>

        <tr>
          <td style="padding:8px 32px 28px 32px;font-family:Arial,Helvetica,sans-serif;">
            <p style="margin:0;font-size:13px;line-height:1.6;color:#6c6f77;">Se não foi você que pediu, avise a Atratis.</p>
          </td>
        </tr>
      </table>
      <p style="margin:16px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#8a8d94;">Atratis Digital · Fortaleza, CE · (85) 3122-4408</p>
    </td>
  </tr>
</table>
</body>
</html>
