name: Verificação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front:
    name: Front-end (tipos e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-de-exemplo

  banco:
    name: Banco (migrations e RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.sh

  funcoes:
    name: Funções de servidor (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: |
          set +e
          status=0
          : > deno-check.txt
          for d in supabase/functions/*/; do
            (cd "$d" && deno check index.ts) >> deno-check.txt 2>&1 || status=1
          done
          cat deno-check.txt
          if [ $status -ne 0 ]; then
            # Publica o erro como anotação (legível pela API do GitHub).
            msg=$(sed 's/\x1b\[[0-9;]*m//g' deno-check.txt | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=deno check::$msg"
          fi
          exit $status
